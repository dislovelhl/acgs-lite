name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev,autonoma,anthropic,mcp,otel,z3]" httpx
      - name: Lint
        run: ruff check src/acgs_lite/
      - name: Validate capability manifest
        if: matrix.python-version == '3.11'
        run: python -m acgs_lite.cli capabilities validate --max-age-days 45
      - name: Type check
        if: matrix.python-version == '3.11'
        run: mypy --config-file pyproject.toml
      - name: Test
        env:
          OPENAI_API_KEY: test-key-for-unit-tests
          ANTHROPIC_API_KEY: test-key-for-unit-tests
        run: |
          python -m pytest tests/ \
            --import-mode=importlib \
            -m "not slow and not benchmark and not e2e" \
            -v --tb=short

  coverage:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev,autonoma,anthropic,mcp,otel,z3]" httpx
      - name: Validate capability manifest
        run: python -m acgs_lite.cli capabilities validate --max-age-days 45
      - name: Test with coverage
        env:
          OPENAI_API_KEY: test-key-for-unit-tests
          ANTHROPIC_API_KEY: test-key-for-unit-tests
        run: |
          python -m pytest tests/ \
            --import-mode=importlib \
            --cov=src/acgs_lite \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=70 \
            -m "not slow and not benchmark and not e2e"
      - name: Critical-path coverage gate (engine, audit, maci, server, lifecycle)
        env:
          OPENAI_API_KEY: test-key-for-unit-tests
          ANTHROPIC_API_KEY: test-key-for-unit-tests
        run: |
          python -m pytest tests/ \
            --import-mode=importlib \
            --cov=src/acgs_lite/engine \
            --cov=src/acgs_lite/audit.py \
            --cov=src/acgs_lite/maci.py \
            --cov=src/acgs_lite/server.py \
            --cov=src/acgs_lite/constitution/lifecycle_service.py \
            --cov=src/acgs_lite/constitution/lifecycle_router.py \
            --cov=src/acgs_lite/constitution/sqlite_bundle_store.py \
            --cov=src/acgs_lite/trajectory.py \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -m "not slow and not benchmark and not e2e"

  governance-regression:
    name: Governance regression gate
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev,autonoma,anthropic,mcp,otel,z3]" httpx
      - name: Governance regression gate
        run: make test-governance

  codeql:
    name: CodeQL
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4.37.7
        with:
          languages: python
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4.37.7
        with:
          category: "/language:python"

  python-fallback:
    name: Python fallback (no Rust companion)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # Deliberately minimal: no Rust companion AND no z3-solver. This lane is
      # the one that proves the formal-verification layer fails closed when its
      # dependency is absent (VerificationStatus.UNAVAILABLE -> block). Do not
      # add z3-solver here to "fix" a failure; fix the fail-closed path instead.
      - name: Install without Rust companion
        run: pip install -e ".[dev,mcp]" httpx
      - name: Confirm acgs-lite-rust is not present
        run: python -c "import importlib.util; assert importlib.util.find_spec('acgs_lite_rust') is None, 'Rust companion unexpectedly installed'"
      - name: Test Python fallback path
        env:
          OPENAI_API_KEY: test-key-for-unit-tests
          ANTHROPIC_API_KEY: test-key-for-unit-tests
        run: |
          python -m pytest tests/ \
            --import-mode=importlib \
            -m "not slow and not benchmark and not e2e" \
            -q --tb=short

  docs:
    name: Docs build and link check
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
        with:
          # git-revision-date-localized needs history to date each page.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install docs toolchain
        run: pip install -e ".[docs]"
      # --strict turns broken internal links and missing snippet includes into
      # build failures, so a blank page can never ship to acgs.ai/docs again.
      - name: Build documentation
        run: python -m mkdocs build --strict
      - name: Check documentation links
        run: python3 scripts/check_links.py

  package:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install build tools
        run: pip install build twine "packaging>=24.1"
      - name: Build wheel and sdist
        run: python -m build --wheel --sdist
      - name: Validate package
        run: twine check dist/*

  agent-workspace:
    name: Agent-ready workspace
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python3 -m pip install -e ".[dev]" httpx
      # Prove a fresh agent can understand and execute the workspace: the registry loads,
      # generated manifests match the canonical index, the tool registry references only
      # live targets/scripts, the required docs exist, and the focused agent tests pass.
      - name: Agent readiness self-check
        env:
          OPENAI_API_KEY: test-key-for-unit-tests
          ANTHROPIC_API_KEY: test-key-for-unit-tests
        run: python3 scripts/agent_ready.py --json --run-tests
      - name: Agent manifests in sync with agent-index.json
        run: python3 scripts/sync_agents.py --check
      - name: Tool registry references only live tools
        run: python3 scripts/validate_tools.py
